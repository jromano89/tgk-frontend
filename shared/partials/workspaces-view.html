<section
  class="tgk-iam-product-panel"
  x-data="{
    workspaceInvestorId: '',
    workspaceInvestorEmail: '',
    workspaceIncludes: []
  }">
  <div class="tgk-iam-product-panel__header">
    <div class="tgk-iam-product-panel__headline">
      <h3 class="tgk-iam-product-panel__title">Create a Docusign Workspace</h3>
    </div>
    <span class="tgk-iam-product-panel__source">Workspaces API</span>
  </div>
  <form class="tgk-iam-product-form" @submit.prevent>
    <div class="tgk-settings-field-grid">
      <label class="tgk-field-card tgk-field-card--compact">
        <span class="tgk-field-label">Investor</span>
        <select
          class="tgk-form-input tgk-form-select"
          x-model="workspaceInvestorId"
          @change="workspaceInvestorEmail = (customers.find((customer) => customer.id === $event.target.value)?.email || '')">
          <option value="">Select an investor</option>
          <template x-for="customer in customers" :key="customer.id">
            <option :value="customer.id" x-text="customer.name"></option>
          </template>
        </select>
      </label>

      <label class="tgk-field-card tgk-field-card--compact" x-show="workspaceInvestorId" x-cloak>
        <span class="tgk-field-label">Investor Email</span>
        <input
          class="tgk-form-input"
          type="email"
          x-model="workspaceInvestorEmail"
          readonly>
      </label>
    </div>

    <div class="tgk-field-card tgk-field-card--compact tgk-iam-product-options">
      <div class="tgk-field-label">Workspace Contents</div>
      <div class="tgk-iam-product-options__title">What should be included in the workspace?</div>
      <div class="tgk-iam-product-option-list">
        <label class="tgk-iam-product-option">
          <input type="checkbox" value="esign-template-1" x-model="workspaceIncludes">
          <span>Individual Brokerage Account</span>
        </label>
        <label class="tgk-iam-product-option">
          <input type="checkbox" value="esign-template-2" x-model="workspaceIncludes">
          <span>Irrevocable Trust</span>
        </label>
        <label class="tgk-iam-product-option">
          <input type="checkbox" value="upload-document-1" x-model="workspaceIncludes">
          <span>Upload a document 1</span>
        </label>
      </div>
    </div>

    <div class="tgk-iam-product-actions">
      <button type="button" class="tgk-button tgk-button--primary">Create Workspace</button>
    </div>
  </form>
</section>
